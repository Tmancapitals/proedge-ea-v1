name: Build and publish APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      capital_vault_url:
        description: 'Deployed HTTPS URL for the Capital Vault web app'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Capital Vault URL
        id: url
        env:
          INPUT_URL: ${{ inputs.capital_vault_url }}
          REPO_URL: ${{ vars.CAPITAL_VAULT_URL }}
        run: |
          URL="$INPUT_URL"
          if [ -z "$URL" ]; then URL="$REPO_URL"; fi
          if [ -z "$URL" ]; then echo "Set repository variable CAPITAL_VAULT_URL or use workflow_dispatch with a URL."; exit 1; fi
          case "$URL" in https://*) ;; *) echo "CAPITAL_VAULT_URL must start with https://"; exit 1;; esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed debug APK
        working-directory: android
        env:
          CAPITAL_VAULT_URL: ${{ steps.url.outputs.url }}
        run: gradle assembleDebug -PCAPITAL_VAULT_URL="$CAPITAL_VAULT_URL"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Capital-Vault-V1.0.apk

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: Capital-Vault-V1.0.apk
